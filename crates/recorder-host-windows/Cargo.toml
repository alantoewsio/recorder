[package]
name = "recorder-host-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows audio capture for recorder-core (WASAPI, ASIO, DirectSound, waveIn, dummy)"

[features]
default = []
asio = ["cpal/asio"]

[dependencies]
recorder-core = { workspace = true }
tracing.workspace = true
bytemuck = "1.14"

[target.'cfg(windows)'.dependencies]
cpal = "0.17"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_DirectSound",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.58"
